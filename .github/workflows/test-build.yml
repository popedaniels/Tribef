name: Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [frontend, backend]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ "${{ matrix.project }}" = "frontend" ]; then
            cd FundandTrace && npm ci
          else
            cd FundandTraceBackend && npm ci
          fi

      - name: Run tests
        run: |
          if [ "${{ matrix.project }}" = "frontend" ]; then
            cd FundandTrace && npm test -- --passWithNoTests 2>&1 | tail -20
          else
            cd FundandTraceBackend && NODE_ENV=test npx mocha ./tests/index.js --timeout 20000 --exit 2>&1 | tail -30
          fi

      - name: Build
        run: |
          if [ "${{ matrix.project }}" = "frontend" ]; then
            cd FundandTrace && NODE_OPTIONS=--openssl-legacy-provider npm run build
          else
            cd FundandTraceBackend && npm run build 2>/dev/null || echo "No build script in backend"
          fi

  deployment:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: echo "Test & build pipeline completed"