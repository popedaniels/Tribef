# Automated security review. Runs on every PR to main, every push to stage,
# and weekly (new advisories appear without code changes).
#  - CodeQL (security-extended) over the backend and frontend
#  - npm audit of production dependencies: fails on high/critical
#  - gitleaks: secrets in the changed commits (PRs/pushes) or the tree (weekly)
#  - route authorisation audit runs in the unit tests (tests/unit/routeAudit.test.js)
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [stage]
  schedule:
    - cron: "41 3 * * 2" # weekly, Tuesday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths-ignore:
              - "**/node_modules/**"
              - "**/tests/**"
              - "**/__tests__/**"
              - "FundandTrace/.next/**"
      - uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results
      - name: Summarise findings
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, collections
          c = collections.Counter(); rows = []
          for f in glob.glob("codeql-results/*.sarif"):
              for run in json.load(open(f))["runs"]:
                  rules = {r["id"]: r for r in run["tool"]["driver"].get("rules", [])}
                  for res in run.get("results", []):
                      rid = res["ruleId"]; sev = rules.get(rid, {}).get("properties", {}).get("security-severity", "-")
                      loc = res["locations"][0]["physicalLocation"]
                      c[rid] += 1; rows.append(f"| {sev} | {rid} | {loc['artifactLocation']['uri']}:{loc.get('region', {}).get('startLine', '')} |")
          print(f"### CodeQL: {sum(c.values())} finding(s)\n")
          if rows: print("| Severity | Rule | Location |\n|---|---|---|\n" + "\n".join(sorted(rows, reverse=True)[:200]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results/*.sarif

  dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [FundandTraceBackend, FundandTrace]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm audit (production dependencies, high and critical)
        working-directory: ${{ matrix.dir }}
        run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          IMG=ghcr.io/gitleaks/gitleaks:v8.21.2
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            # Whole tree as it is now (history is handled by docs/LAUNCH_RUNBOOK.md §2).
            docker run --rm -v "$PWD:/repo" $IMG dir /repo --config /repo/.gitleaks.toml --redact --no-banner
          else
            docker run --rm -v "$PWD:/repo" $IMG git /repo --config /repo/.gitleaks.toml --redact --no-banner --log-opts="$BASE..HEAD"
          fi
