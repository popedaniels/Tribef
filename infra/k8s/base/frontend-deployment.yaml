apiVersion: apps/v1
kind: Deployment
metadata:
  name: fundandtrace-frontend
  namespace: fundandtrace
  labels:
    app: fundandtrace-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fundandtrace-frontend
  template:
    metadata:
      labels:
        app: fundandtrace-frontend
    spec:
      containers:
        - name: frontend
          image: fundandtrace-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: fundandtrace-config
                  key: NEXT_PUBLIC_API_URL
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: fundandtrace-frontend-svc
  namespace: fundandtrace
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: fundandtrace-frontend
