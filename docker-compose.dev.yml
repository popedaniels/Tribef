version: "3.8"

services:
  mongo:
    image: mongo:8
    container_name: fundandtrace-dev-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-dev-data:/data/db
    networks:
      - fundandtrace-dev-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fundandtrace-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    networks:
      - fundandtrace-dev-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./FundandTraceBackend
      dockerfile: Dockerfile
    container_name: fundandtrace-dev-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./FundandTraceBackend/.env
    environment:
      - NODE_ENV=development
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - MONGOURL=mongodb://mongo:27017/fundandtrace
      - DB_URL=mongodb://mongo:27017/fundandtrace
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fundandtrace-dev-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./FundandTrace
      dockerfile: Dockerfile
    container_name: fundandtrace-dev-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./FundandTrace/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - fundandtrace-dev-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  fundandtrace-dev-net:
    driver: bridge

volumes:
  mongo-dev-data:
  redis-dev-data:
