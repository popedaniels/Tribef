# Daily live FX check (FundandTraceBackend/scripts/fx-check.js): the rates
# provider answers with fresh, sane rates that an independent source agrees
# with, and production (repo variable PRODUCTION_API_URL) serves them.
name: FX check

on:
  schedule:
    - cron: "37 7 * * *"
  workflow_dispatch:
  push:
    branches: [stage]
    paths: ["FundandTraceBackend/services/fx.js", "FundandTraceBackend/scripts/fx-check.js", ".github/workflows/fx-check.yml"]

permissions:
  contents: read

jobs:
  fx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: FundandTraceBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: FundandTraceBackend/package-lock.json
      - run: npm ci --omit=dev
      - run: node scripts/fx-check.js
        env:
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
