version: "3.8"

services:
  # Production Reverse Proxy & SSL Termination
  nginx:
    image: nginx:alpine
    container_name: fundandtrace-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - fundandtrace-net

  # Next.js Frontend Application
  frontend:
    build:
      context: ./FundandTrace
      dockerfile: Dockerfile
    container_name: fundandtrace-frontend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.fundandtrace.com}
      - URL=${MAINURL:-https://fundandtrace.com}
      - STRIPEPUBLIC=${STRIPEPUBLIC}
      - CHARITIES_API=${CHARITIES_API}
      - NODE_OPTIONS=--openssl-legacy-provider
    networks:
      - fundandtrace-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Redis — shared rate-limit counters across instances
  redis:
    image: redis:7-alpine
    container_name: fundandtrace-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - fundandtrace-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Express Backend API
  backend:
    build:
      context: ./FundandTraceBackend
      dockerfile: Dockerfile
    container_name: fundandtrace-backend
    restart: always
    env_file:
      - ./FundandTraceBackend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - fundandtrace-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Certbot Automated TLS Certificate Renewer (Optional for standalone servers)
  certbot:
    image: certbot/certbot
    container_name: fundandtrace-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - fundandtrace-net

networks:
  fundandtrace-net:
    driver: bridge

volumes:
  redis-data:
