name: Lint & Typecheck

on:
  push:
    branches: [main, develop, stage]
  pull_request:
    branches: [main, develop]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FundandTrace
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FundandTrace/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Protocol checklist
        run: npm run validate

  backend:
    name: Backend syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FundandTraceBackend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FundandTraceBackend/package-lock.json
      - run: npm ci
      - run: npm run lint
