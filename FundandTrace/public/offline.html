<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6979F8" />
    <title>You're offline · Fund&amp;Trace</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        font-family: "Plus Jakarta Sans", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #eef0ff 0%, #f8f9fc 60%);
        color: #151a30;
      }
      main {
        max-width: 420px; text-align: center; background: #fff; border-radius: 20px;
        padding: 40px 32px; box-shadow: 0 1px 2px rgba(21,26,48,.06), 0 12px 40px rgba(21,26,48,.08);
      }
      .badge {
        width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 16px; display: grid; place-items: center;
        background: #eef0ff; color: #5562e6;
      }
      h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { margin: 0 0 24px; color: #5b6380; line-height: 1.55; font-size: 15px; }
      button {
        font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 12px 22px; cursor: pointer;
        background: #5562e6; color: #fff; min-height: 44px;
      }
      button:focus-visible { outline: 3px solid #a9b0ff; outline-offset: 2px; }
      @media (prefers-color-scheme: dark) {
        body { background: #0d1020; color: #eef0ff; }
        main { background: #161a2e; box-shadow: none; }
        p { color: #a6acc6; }
        .badge { background: #232846; color: #a9b0ff; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><line x1="12" y1="20" x2="12.01" y2="20"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
      </div>
      <h1>You're offline</h1>
      <p>We couldn't reach Fund&amp;Trace. Your donations and campaign data are safe — reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
