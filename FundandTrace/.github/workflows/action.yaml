name: frontend

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FundandTrace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: FundandTrace/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build && (npm start & sleep 8 && npm run test:e2e; CODE=$?; pkill -f "next start"; exit $CODE)
      - run: npm run build
      - run: docker build --tag fundandtrace-frontend:test .
