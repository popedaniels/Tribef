name: Lint & Typecheck

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [frontend, backend]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ "${{ matrix.project }}" = "frontend" ]; then
            cd FundandTrace && npm ci
          else
            cd FundandTraceBackend && npm ci
          fi

      - name: Run lint
        run: |
          if [ "${{ matrix.project }}" = "frontend" ]; then
            cd FundandTrace && npm run lint
          else
            cd FundandTraceBackend && npm run lint 2>/dev/null || echo "No lint script in backend"
          fi

      - name: Run typecheck
        run: |
          if [ "${{ matrix.project }}" = "frontend" ]; then
            cd FundandTrace && npm run typecheck
          else
            cd FundandTraceBackend && npx tsc --noEmit 2>/dev/null || echo "No tsc in backend"
          fi

  approvals:
    needs: lint
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "Lint & typecheck pipeline completed"