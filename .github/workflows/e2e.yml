# Browser end-to-end tests (Playwright) on a production build of the web app
# against the mock API (FundandTrace/e2e/mock-api.js), which serves the real
# fee-schedule route. Desktop Chrome + a Pixel 7 profile.
name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [stage]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            FundandTrace/package-lock.json
            FundandTraceBackend/package-lock.json
      - name: Install backend (mock API uses its fee and ledger code)
        working-directory: FundandTraceBackend
        run: npm ci
      - name: Install web app
        working-directory: FundandTrace
        run: npm ci
      - name: Build (API at localhost:5000)
        working-directory: FundandTrace
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx next build
      - name: Install Chromium
        working-directory: FundandTrace
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: FundandTrace
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            FundandTrace/playwright-report
            FundandTrace/test-results
          retention-days: 7
