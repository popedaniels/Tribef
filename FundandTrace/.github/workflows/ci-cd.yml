name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

  frontend:
    needs: test-and-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: ./FundandTrace
        run: npm ci

      - name: Run TypeScript check
        working-directory: ./FundandTrace
        run: npm run typecheck

      - name: Run lint (zero warnings)
        working-directory: ./FundandTrace
        run: npm run lint -- --max-warnings=0

      - name: Run unit tests
        working-directory: ./FundandTrace
        run: npm test

      - name: Install Playwright browsers
        working-directory: ./FundandTrace
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: ./FundandTrace
        run: npm run build && (npm start & sleep 8 && npm run test:e2e; CODE=$?; pkill -f "next start"; exit $CODE)

      - name: Build Next.js
        working-directory: ./FundandTrace
        run: npm run build

  backend:
    needs: test-and-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: ./FundandTraceBackend
        run: npm ci

      - name: Run lint (zero warnings)
        working-directory: ./FundandTraceBackend
        run: npx eslint . --ext .js --max-warnings=0

      - name: Run tests (requires MongoDB)
        working-directory: ./FundandTraceBackend
        env:
          MONGOURL: "mongodb://localhost:27017/fundandtrace_test"
          NODE_ENV: test
        run: npm run test:unit

  security:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit (blocking on high)
        working-directory: ./FundandTrace
        run: npm audit --audit-level=high

      - uses: anchore/scan-action@v2
        with:
          format: sarif
          path: ./FundandTrace

  deploy:
    needs: [frontend, backend, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: echo "Deployment step - would trigger production deployment"