apiVersion: apps/v1
kind: Deployment
metadata:
  name: fundandtrace-backend
  namespace: fundandtrace
  labels:
    app: fundandtrace-backend
spec:
  replicas: 2
  # Zero-downtime deploys: bring a new pod up before taking an old one down.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: fundandtrace-backend
  template:
    metadata:
      labels:
        app: fundandtrace-backend
    spec:
      # server.js drains in-flight requests on SIGTERM (SHUTDOWN_GRACE_MS=15s).
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: backend
          image: fundandtrace-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: fundandtrace-config
            - secretRef:
                name: fundandtrace-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          lifecycle:
            # Give the Service time to stop routing to this pod before it
            # receives SIGTERM, so no request lands on a closing server.
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fundandtrace-backend-pdb
  namespace: fundandtrace
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: fundandtrace-backend
---
apiVersion: v1
kind: Service
metadata:
  name: fundandtrace-backend-svc
  namespace: fundandtrace
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: fundandtrace-backend
